name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notificar IndexNow (Bing/Yahoo/DuckDuckGo/Ecosia)
        # A chave IndexNow não é segredo — por design é pública e servida
        # pelo próprio site em /f5975d6a13f055a1ab5064aa4e4dd10a.txt, então
        # fica hardcoded aqui em vez de virar um GitHub Secret. Isso só
        # acelera a descoberta das URLs; nunca deve derrubar um deploy que
        # já terminou com sucesso.
        continue-on-error: true
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d '{
              "host": "trevizzosolucoes.com.br",
              "key": "f5975d6a13f055a1ab5064aa4e4dd10a",
              "keyLocation": "https://trevizzosolucoes.com.br/f5975d6a13f055a1ab5064aa4e4dd10a.txt",
              "urlList": [
                "https://trevizzosolucoes.com.br/",
                "https://trevizzosolucoes.com.br/automacao-e-ia/",
                "https://trevizzosolucoes.com.br/criacao-de-sites-belo-horizonte/",
                "https://trevizzosolucoes.com.br/criacao-de-sites/",
                "https://trevizzosolucoes.com.br/politica-de-privacidade/",
                "https://trevizzosolucoes.com.br/sistemas-sob-medida/",
                "https://trevizzosolucoes.com.br/termos-de-servico/"
              ]
            }')
          # 200/202 = aceito; 403 = chave não encontrada em keyLocation.
          echo "IndexNow respondeu HTTP $status"
